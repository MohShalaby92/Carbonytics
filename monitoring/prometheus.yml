global:
  scrape_interval: 15s
  external_labels:
    monitor: 'carbonytics-monitor'

scrape_configs:
  # Application metrics (prom-client: default Node/process + HTTP duration/count).
  - job_name: 'carbonytics-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']

  # MongoDB via percona/mongodb_exporter (clusterMonitor user).
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']

  # Redis via oliver006/redis_exporter.
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Edge nginx via nginx-prometheus-exporter (scrapes nginx:8080/stub_status).
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # Prometheus self-monitoring.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
