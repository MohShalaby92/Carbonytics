# Redis Production Configuration
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60

# Security
# NOTE: requirepass is NOT set here -- a redis.conf does not expand ${ENV} vars,
# so the password is injected at runtime via the command flag in
# docker-compose.prod.yml (`redis-server /etc/redis/redis.conf --requirepass ...`),
# which reads REDIS_PASSWORD from the container environment (env_file).
# Destructive commands are disabled in production (CONFIG is left enabled so the
# redis metrics exporter can read runtime config):
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# Memory and persistence
maxmemory 256mb
maxmemory-policy allkeys-lru
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
# Empty logfile -> log to stdout so `docker logs` captures it (the alpine image
# has no /var/log/redis directory; a missing path would prevent startup).
logfile ""

# Performance
tcp-backlog 511
databases 16