# Production stack for Carbonytics.
#
# Topology (single public origin, TLS terminated at the edge):
#
#   internet --443--> nginx (edge, TLS) ──/───────────> frontend:80   (static Vite SPA)
#                                        └──/api,/health──> backend:5000
#                     backend ──> mongo (auth) + redis (auth)
#
# Secrets are NEVER committed. Copy .env.production.example -> .env.production,
# fill in strong values (`openssl rand -base64 48`), and keep it out of git
# (.env.production is gitignored). Compose injects it via `env_file:`.
#
# IMPORTANT: this file deliberately avoids ${VAR} interpolation for secrets.
# Compose interpolates ${VAR} from the shell / a project `.env`, NOT from the
# `env_file:` below — so secrets flow into containers through env_file instead,
# and `docker compose -f docker-compose.prod.yml config` is clean with no
# project .env present. Where a secret must reach a `command:` (redis), a
# `sh -c` shell reads it from the container environment (provided by env_file).
#
# First boot:
#   1) cp .env.production.example .env.production    # then edit in real secrets
#   2) ./scripts/gen-self-signed-cert.sh            # or drop real certs in nginx/ssl/
#   3) docker compose -f docker-compose.prod.yml up -d --build
#
# Verify locally WITHOUT touching the dev stack — use an isolated project name
# (separate volumes/network) and tear it down with `down -v` afterwards:
#   docker compose -p carbonytics-prod -f docker-compose.prod.yml up -d --build

services:
  # ---- Edge reverse proxy: terminates TLS, single public origin ----
  # TLS config + 80->443 redirect land in SI-3 (nginx/nginx.conf rewrite).
  nginx:
    image: nginx:1.27-alpine
    container_name: carbonytics-proxy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - carbonytics

  # ---- Frontend: static Vite SPA served by its own nginx on :80 ----
  # Built at image-build time; relative "/api" is proxied (no runtime env).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carbonytics-frontend
    expose:
      - '80'
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - carbonytics
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/']
      interval: 30s
      timeout: 5s
      retries: 5

  # ---- Backend: Node/Express API on :5000 (internal only) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carbonytics-backend
    expose:
      - '5000'
    # Non-secret, static configuration. Secrets (MONGODB_URI, REDIS_URL,
    # JWT_SECRET, JWT_REFRESH_SECRET, CLIENT_URL, COOKIE_DOMAIN) come from
    # env_file so they are never baked into the image or this file.
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_ACCESS_EXPIRE=15m
      - JWT_REFRESH_EXPIRE=7d
      - COOKIE_SECURE=true
      - RATE_LIMIT_WINDOW=900000
      - RATE_LIMIT_MAX=100
      - AUTH_RATE_LIMIT_MAX=10
      - MAX_FILE_SIZE=10485760
      - CACHE_TTL=3600
      - UPLOAD_PATH=/app/uploads
    env_file:
      - .env.production
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - carbonytics
    volumes:
      - uploads:/app/uploads
      - ./logs/backend:/app/logs
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/health']
      interval: 15s
      timeout: 5s
      retries: 5

  # ---- MongoDB (authenticated) ----
  mongo:
    image: mongo:7.0
    container_name: carbonytics-mongo
    # MONGO_INITDB_ROOT_USERNAME/PASSWORD (from env_file) make the official image
    # enable authentication on first boot and create the root user. The init
    # script then creates a least-privilege readWrite app user that the backend
    # connects as (see mongo/init/01-app-user.sh).
    environment:
      - MONGO_INITDB_DATABASE=carbonytics_prod
    env_file:
      - .env.production
    volumes:
      - mongo_data:/data/db
      - ./backups:/backup
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - carbonytics
    healthcheck:
      # `ping` needs no auth, so this works before and after auth is enabled.
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Redis (password-protected, destructive commands disabled) ----
  redis:
    image: redis:7.2-alpine
    container_name: carbonytics-redis
    # redis.conf carries the non-secret hardening (renamed FLUSHALL/FLUSHDB/DEBUG,
    # maxmemory, persistence). The password can't live in the conf (no ${ENV}
    # expansion there), so it is appended at runtime from the container env via a
    # shell, which reads REDIS_PASSWORD supplied by env_file.
    # $$ escapes compose interpolation so the literal $REDIS_PASSWORD reaches the
    # in-container shell, which expands it from the env_file-provided environment.
    command: ['sh', '-c', 'exec redis-server /etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    env_file:
      - .env.production
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    restart: unless-stopped
    networks:
      - carbonytics
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Monitoring (real /metrics + exporters wired in SI-4) ----
  prometheus:
    image: prom/prometheus:latest
    container_name: carbonytics-prometheus
    expose:
      - '9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - carbonytics

  grafana:
    image: grafana/grafana:latest
    container_name: carbonytics-grafana
    ports:
      - '3001:3000'
    # GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD come from env_file.
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
    env_file:
      - .env.production
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - carbonytics

  # ---- Exporters (Prometheus scrape targets) ----
  # Credentials come from .env.monitoring (a monitoring-only secrets file), kept
  # separate from .env.production so no app/JWT secrets reach the exporters. The
  # mongo monitoring user (clusterMonitor) is created by mongo/init/01-app-user.sh.
  mongodb-exporter:
    image: percona/mongodb_exporter:0.43.1
    container_name: carbonytics-mongodb-exporter
    command:
      - '--collect-all'
      - '--compatible-mode'
    env_file:
      - .env.monitoring
    expose:
      - '9216'
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - carbonytics

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: carbonytics-redis-exporter
    env_file:
      - .env.monitoring
    expose:
      - '9121'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - carbonytics

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: carbonytics-nginx-exporter
    command:
      - '--nginx.scrape-uri=http://nginx:8080/stub_status'
    expose:
      - '9113'
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - carbonytics

  # ---- Automated MongoDB backups (scheduled mongodump sidecar) ----
  # Stock mongo image (bundles mongodump matching the server). Dumps once on
  # start, then every BACKUP_INTERVAL seconds, to the ./backups volume with
  # BACKUP_RETENTION_DAYS retention. Uses the root credentials from env_file
  # (it needs to read the whole app db). Restore via scripts/restore-data.sh.
  backup:
    image: mongo:7.0
    container_name: carbonytics-backup
    command: ['bash', '/backup.sh']
    env_file:
      - .env.production
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backups:/backup
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - carbonytics

volumes:
  mongo_data:
  redis_data:
  uploads:
  prometheus_data:
  grafana_data:

networks:
  carbonytics:
    driver: bridge
