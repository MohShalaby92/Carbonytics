# MongoDB tuning reference (NOT mounted by docker-compose.prod.yml).
# Production authentication is enabled by the official image via the
# MONGO_INITDB_ROOT_USERNAME/PASSWORD env vars (env_file), and a least-privilege
# app user is created by mongo/init/01-app-user.sh -- so `security.authorization`
# does not need to be set here. Keep this file only as a tuning reference; mount
# it and add `security: { authorization: enabled }` if you switch to a
# config-file-driven mongod.
storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  logRotate: reopen

net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 100

# Disable authentication for simpler deployment
# security:
#   authorization: enabled

operationProfiling:
  slowOpThresholdMs: 100
  mode: slowOp