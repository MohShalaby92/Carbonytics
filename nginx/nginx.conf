# Carbonytics edge reverse proxy -- terminates TLS, single public origin.
#
#   /              -> frontend:80  (its own nginx serves the Vite build + CSP)
#   /api , /health -> backend:5000 (direct, so the backend sees exactly ONE
#                     proxy hop and `trust proxy: 1` reads the real client
#                     IP/proto for rate limiting + secure cookies)
#
# /metrics is intentionally NOT proxied here -- Prometheus scrapes it over the
# private docker network (backend:5000/metrics), never from the public internet.
#
# Certificates live in /etc/nginx/ssl (mounted read-only, gitignored). For
# local/staging run scripts/gen-self-signed-cert.sh. For production drop in real
# CA certs with the SAME filenames (fullchain.pem + privkey.pem) -- e.g.
# Let's Encrypt/certbot, whose http-01 challenge is served from the
# /.well-known/acme-challenge/ location below (mount a certbot webroot at
# /var/www/certbot to use it).

events { worker_connections 1024; }

http {
  upstream backend_upstream  { server backend:5000; }
  upstream frontend_upstream { server frontend:80; }

  # Forwarded to every upstream (inherited by all location blocks since none of
  # them redefine proxy_set_header). X-Forwarded-Proto=https lets the backend
  # know the original request was TLS (secure cookies, req.secure).
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;

  # Largest upload the backend accepts (MAX_FILE_SIZE 10 MB) plus slack.
  client_max_body_size 12m;

  # --- HTTP :80 -- ACME challenge + permanent redirect to HTTPS ---
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # --- HTTPS :443 -- TLS termination + routing ---
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (1 year). Sent only over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API + health -> backend directly (single proxy hop). Set-Cookie passes through.
    location /api/ {
      proxy_pass http://backend_upstream;
    }
    location = /health {
      proxy_pass http://backend_upstream;
    }

    # Everything else -> the SPA (frontend nginx serves static assets + its CSP).
    location / {
      proxy_pass http://frontend_upstream;
    }
  }
}
